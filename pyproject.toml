[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aster"
version = "0.1.0"
description = "Aster local desktop coding orchestrator with OpenAI API and browser fallback modes."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests>=2.32,<3"
]

[project.scripts]
aster = "aster.ui_or_cli.cli:main"

[tool.setuptools.packages.find]
include = ["aster*"]
